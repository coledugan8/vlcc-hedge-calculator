name: Update data and publish site

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC (about 5-6 AM in Texas)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]         # republish whenever you change the site

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest data from FRED
        continue-on-error: true   # if FRED is down, keep publishing yesterday's data
        run: python scripts/update_data.py

      - name: Save new data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && touch data/.gitkeep
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update market data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
